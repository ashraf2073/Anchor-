name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Assets and Build APK
        run: |
          npm install
          
          # Create the www directory Capacitor requires and copy your root files into it
          mkdir -p www
          cp index.html www/
          
          # Copy other web assets if they exist in your root
          [ -f style.css ] && cp style.css www/
          [ -f script.js ] && cp script.js www/
          [ -d assets ] && cp -r assets www/

          npx cap add android || true
          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anchor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
